[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fdsrouter"
version = "0.1.0"
description = "Lokale Warteschlangen-Steuerung fuer FDS-Simulationslaeufe"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psutil>=6.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Desktop tray icon; installed into its own environment by install.sh --tray, because the
# Linux backend needs PyGObject from the distribution rather than from PyPI.
tray = [
    "pystray>=0.19",
    "pillow>=10.0",
]

[project.scripts]
fdsrouter = "fdsrouter.cli:main"

[tool.setuptools.packages.find]
include = ["fdsrouter*"]

[tool.setuptools.package-data]
fdsrouter = ["static/*", "static/vendor/*", "db/schema.sql"]
