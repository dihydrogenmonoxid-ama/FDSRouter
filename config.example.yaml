# FDSRouter configuration.
#
# Copy this file to config.yaml and adjust the paths for your installation, or just run
# `fdsrouter start` once without a config.yaml -- it will be generated automatically and try
# to find fds/mpirun on PATH itself.

# 127.0.0.1 keeps FDSRouter reachable only from this machine. To operate it from other
# computers in the office (browser on a workstation, service on the compute server), set this
# to "0.0.0.0". FDSRouter is open until the first account is created via the login screen, and
# has no role/permission system even after that -- only run it on a trusted network.
host: "127.0.0.1"
port: 8000
open_browser: true

# Data directory for the SQLite database (relative to the project directory, or absolute).
data_dir: "./data"

# Path to the FDS binary and the MPI executable.
fds_binary: "/Applications/FDS/FDS6/bin/fds"
mpi_executable: "/Applications/FDS/FDS6/bin/openmpi/bin/mpirun"

# Command template as an argument list (not a shell string, to avoid quoting/injection
# issues). Placeholders: {mpi_exec}, {n_processes}, {fds_binary}, {fds_file}
mpi_command_template:
  - "{mpi_exec}"
  - "-n"
  - "{n_processes}"
  - "{fds_binary}"
  - "{fds_file}"

# Number of MPI processes to use when a job doesn't specify its own.
default_mpi_processes: 1

# Where cases uploaded through the web interface are stored. Each upload gets its own
# subdirectory, which becomes the working directory FDS writes its results into.
upload_dir: "./data/cases"

# Rejection threshold for a single upload, in megabytes (sum of all files).
max_upload_mb: 512

# Temperature/fan readout is platform-dependent and usually unavailable on macOS without
# sudo. Core functionality (queue, load monitoring, out-file parsing) does not depend on it.
temperature_enabled: true

# Off by default. Set to a header name (e.g. "X-Remote-User") to trust an already-authenticated
# username from that header instead of requiring a password login -- only safe behind a reverse
# proxy that authenticates the request itself and strips any client-supplied copy of the header.
trusted_proxy_header: null

# Shared secret a remote `fdsrouter agent` process presents to join this Controller as a
# compute node (see "Cluster / multiple machines" in the README). Auto-generated on the first
# run if left unset -- shown on the Controller under Operations -> Cluster, and asked for
# automatically by `fdsrouter agent`'s first-run pairing setup.
cluster_token: null

# Answers a UDP broadcast on the local network so `fdsrouter agent`'s pairing setup can find
# this Controller without the operator typing an IP -- reveals only hostname/port, never
# cluster_token. Only takes effect once host is not loopback-only (see above); has no effect on
# a Controller bound to 127.0.0.1, since it wouldn't be reachable from another machine anyway.
discovery_enabled: true

# "controller" (serve the queue, own the database), "agent" (join another machine's Controller
# as a compute node -- also needs controller_url below), or "auto" to decide interactively on
# the very first `fdsrouter start` (only when run at a real terminal; unattended starts always
# become a Controller). Once decided, `fdsrouter start` never asks again -- set this explicitly
# to skip the question entirely, e.g. when scripting the rollout of several compute nodes.
role: "auto"

# Only used when role is "agent": which Controller to join. Left for the interactive pairing
# step to fill in in the common case.
controller_url: null
